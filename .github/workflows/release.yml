name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon. macos-latest is already arm64, so this is native.
          - target: aarch64-apple-darwin
            os: macos-latest
          # Linux amd64, statically linked against musl. A glibc build is
          # tied to the glibc of whatever runner built it, so it refuses to
          # start on any older distribution; this one runs anywhere.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `stable`: a floating toolchain means a Rust release
      # can fail CI on a lint that did not exist when the code was written,
      # with nothing in the repo having changed. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $tag does not match Cargo.toml version $crate" >&2
            exit 1
          fi

      - run: cargo test --all-targets
      - run: cargo build --release --target ${{ matrix.target }}

      # A binary that quietly picked up a dynamic libc would fail on exactly
      # the older machines this target exists to serve.
      - name: Confirm the Linux build is static
        if: endsWith(matrix.target, '-musl')
        run: |
          binary="target/${{ matrix.target }}/release/ports"
          file "$binary"
          # A shared-library dependency shows up as a `libfoo.so => /path`
          # line. Matching on that rather than on ldd's wording for a static
          # binary, which is "statically linked" here and "not a dynamic
          # executable" elsewhere depending on version and binary type.
          if ldd "$binary" 2>&1 | grep -q "=>"; then
            echo "expected a statically linked binary, but it has shared deps:" >&2
            ldd "$binary" >&2
            exit 1
          fi

      # A single gzipped binary rather than a tarball, so the npm installer and
      # the self-updater need nothing but a gunzip.
      - name: Package
        shell: bash
        run: |
          gzip -c "target/${{ matrix.target }}/release/ports" > "ports-${{ matrix.target }}.gz"
          shasum -a 256 "ports-${{ matrix.target }}.gz" > "ports-${{ matrix.target }}.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ports-${{ matrix.target }}
          path: |
            ports-${{ matrix.target }}.gz
            ports-${{ matrix.target }}.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Read once here so the steps below can skip themselves when a registry
    # has no token configured, rather than failing the run after the release
    # and its binaries already exist.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One manifest the updater can fetch in a single request, rather than a
      # sidecar file per target.
      - name: Collect checksums
        run: |
          cd artifacts
          cat ./*.sha256 | sed 's|\./||' > checksums.txt
          rm -f ./*.sha256
          cat checksums.txt

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The npm package downloads the binaries above, so it can only be
      # published once the release exists.
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        working-directory: npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish to crates.io
        if: env.CARGO_TOKEN != ''
        run: cargo publish --token "$CARGO_TOKEN"
