name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than `stable`: a floating toolchain means a Rust release
      # can fail CI on a lint that did not exist when the code was written,
      # with nothing in the repo having changed. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Several tests bind real sockets and read the process table, so they
      # exercise the platform differences that matter here.
      - run: cargo test --all-targets
