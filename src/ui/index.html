<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ports — localhost departure board</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0e0d'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23f0a640'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div class="scanbar" id="scanbar" aria-hidden="true"><i id="scanfill"></i></div>

    <header class="masthead">
      <div class="brand">
        <span class="lamp" id="lamp" data-state="idle"></span>
        <h1>PORTS</h1>
        <span class="sub" id="subtitle">localhost departure board</span>
      </div>

      <div class="toolbar">
        <div class="seg" role="group" aria-label="Status filter">
          <button data-filter="ok" class="on" aria-pressed="true">
            2xx–3xx <em id="count-ok">0</em>
          </button>
          <button data-filter="err" aria-pressed="false">
            4xx–5xx <em id="count-err">0</em>
          </button>
        </div>
        <div class="seg" role="group" aria-label="View">
          <button data-view="list" class="on" aria-pressed="true" title="Dense list">LIST</button>
          <button data-view="grid" aria-pressed="false" title="Thumbnails">GRID</button>
        </div>
        <button class="ghost" id="rescan" title="Force a full rescan">RESCAN</button>
        <button class="ghost icon" id="theme" title="Toggle theme" aria-label="Toggle theme">
          <span data-icon="sun">☀</span><span data-icon="moon">☾</span>
        </button>
      </div>
    </header>

    <div class="phase" id="phase"></div>

    <main>
      <section class="board" id="board" aria-live="polite"></section>

      <p class="empty" id="empty" hidden>
        No web servers match this filter.
      </p>

      <button class="hidden-bar" id="hidden-bar" hidden>
        <span class="dot warn"></span>
        <span id="hidden-text"></span>
        <span class="cta">show</span>
      </button>

      <details class="drawer" id="tcp-drawer" hidden>
        <summary>
          <span class="chev">▸</span> Other listeners
          <em id="count-tcp">0</em>
          <span class="hint">accept connections but do not speak HTTP</span>
        </summary>
        <div class="board sub-board" id="tcp-board"></div>
      </details>

      <details class="drawer" id="history-drawer" hidden>
        <summary>
          <span class="chev">▸</span> Previously seen
          <em id="count-dead">0</em>
          <span class="hint">not running now</span>
        </summary>
        <div class="board sub-board" id="history-board"></div>
      </details>
    </main>

    <footer class="legend">
      <span><i class="dot ok"></i> reachable</span>
      <span><i class="dot warn"></i> client error</span>
      <span><i class="dot err"></i> server error</span>
      <span><i class="dot idle"></i> remembered</span>
      <span class="spacer"></span>
      <span id="conn" class="conn">connecting…</span>
    </footer>

    <script src="/app.js" type="module"></script>
  </body>
</html>
